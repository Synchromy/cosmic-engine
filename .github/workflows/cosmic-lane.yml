name: Cosmic lane

# The Synchromy lanes (cosmic/<tag>) are upstream's tag plus the patches in
# cosmic/patches.json. Upstream's workflows trigger on master only, so a PR
# into a lane ran no checks at all: cosmic/v0.48.5 failed its own module-size
# and plugin-tree checks for days unnoticed. This is the lane's own gate, kept
# small on purpose: the register's tests, every patch's tests (read from the
# register, never listed here), the checks the rebuild regenerates for, and
# `reproduce`, which proves the register still describes the lane.
#
# Carried by every rebuild (it is in the register's `carry` list).

on:
  push:
    branches: ['cosmic/**']
  pull_request:
    branches: ['cosmic/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No embedding retries against a provider CI has no key for (the same
      # setting `cosmic-patches.ts rebuild` runs the patch tests with).
      GBRAIN_EMBED_RETRY_MAX: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: Patch register
        run: bun test --timeout=60000 test/cosmic-patches.test.ts
      - name: Brand leak test, branded half
        run: COSMIC_BRAND=Cosmic bun test --timeout=60000 test/cosmic-brand.test.ts

      - name: Every patch's tests and every carried test, from the register
        # One bun process per file: a *.serial.test.ts needs module-registry
        # isolation, and a per-file result names the patch that broke.
        run: |
          set -uo pipefail
          files="$(bun -e '
            const r = JSON.parse(await Bun.file("cosmic/patches.json").text());
            const t = [...r.patches.flatMap(p => p.tests), ...r.carry.map(c => c.path).filter(p => p.startsWith("test/"))];
            console.log([...new Set(t)].filter(p => p !== "test/cosmic-patches.test.ts").join("\n"));
          ')"
          [ -n "$files" ] || { echo "register lists no tests"; exit 1; }
          failed=""
          for f in $files; do
            echo "::group::$f"
            bun test --timeout=60000 "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi

      - name: Module size ledger
        if: ${{ !cancelled() }}
        run: bash scripts/check-module-size.sh
      - name: Plugin tree is fresh
        if: ${{ !cancelled() }}
        run: bash scripts/check-plugin-tree.sh
      - name: Tool catalog is fresh
        if: ${{ !cancelled() }}
        run: bash scripts/check-tool-catalog-fresh.sh
      - name: CLI flag validation
        if: ${{ !cancelled() }}
        run: bun test --timeout=60000 test/cli-flag-validation.test.ts

  reproduce:
    # Rebuilds the lane's base tag from the register and diffs it against this
    # commit: the register must describe the lane completely. Fetches the
    # upstream tag (public) and the patch branches from origin.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Commit identity for the rebuild's merges
        run: |
          git config --global user.name "cosmic-lane-ci"
          git config --global user.email "cosmic-lane-ci@users.noreply.github.com"
      - name: Rebuild the base tag from the register
        run: bun scripts/cosmic-patches.ts reproduce
